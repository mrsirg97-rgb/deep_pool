[package]
name = "deep_pool"
version = "8.0.0"
description = "Immutable constant-product pool protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "deep_pool"
# Anchor #[program] handlers + #[derive(Accounts)] structs can't run outside
# an SBPF/Anchor context, so any doctest example would either fail to compile
# or be a lie. Skip the doctest phase entirely.
doctest = false

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed", "event-cpi"] }
anchor-spl = { version = "0.32.1", features = ["token", "associated_token", "token_2022", "token_2022_extensions"] }

[dev-dependencies]
proptest = "1.5"
litesvm = "0.7"
solana-sdk = "2"
solana-program = "2"
solana-system-interface = "1"
spl-token-2022 = "8"
